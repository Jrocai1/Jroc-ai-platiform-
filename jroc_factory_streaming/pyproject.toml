[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "jroc-factory-streaming"
version = "0.1.0"
description = "Authenticated J-ROC AI Factory WebSocket orchestration and compliant asset intake"
requires-python = ">=3.11"
dependencies = ["websockets>=17,<18", "pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
